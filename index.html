<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Placement Sprint: a 16-week placement and AI/ML study planner with daily topics, notes and ratings.">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Placement Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#090D1C; --bg2:#0F1530; --card:#151C38; --card-hi:#1C2548; --line:rgba(214,222,255,.09); --line-hi:rgba(214,222,255,.18);
  --text:#EEF1FA; --muted:#A1AACA; --dim:#6B7597;
  --saffron:#FFB347; --saffron-ink:#1B1204; --coral:#FF7A6B; --mint:#52E0B2; --sky:#72BCFF; --lilac:#BBA2FF;
  --display:"Unbounded", "Segoe UI", system-ui, sans-serif;
  --body:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:18px; --tab-h:68px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;min-height:100%;
  background:
    radial-gradient(900px 520px at 85% -10%, rgba(114,188,255,.13), transparent 60%),
    radial-gradient(700px 480px at -10% 110%, rgba(255,179,71,.10), transparent 60%),
    var(--bg);
  background-attachment:fixed}
html.lock, html.lock body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--sky)}
:focus-visible{outline:2px solid var(--saffron);outline-offset:3px;border-radius:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.screen{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:28px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:14px;border:1px solid var(--line-hi);background:var(--card);font-weight:600;font-size:15px;transition:transform .15s ease, background .2s, border-color .2s}
.btn:hover{border-color:var(--saffron)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--saffron);color:var(--saffron-ink);border-color:var(--saffron);box-shadow:0 10px 30px -12px rgba(255,179,71,.6)}
.btn.primary:hover{background:#FFC46B}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn svg{width:18px;height:18px;flex:none}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;min-height:calc(100vh - 180px)}
.hero-copy{display:flex;flex-direction:column;gap:18px;max-width:520px}
.greet{font-family:var(--display);font-weight:700;font-size:clamp(30px,5.4vw,52px);line-height:1.08;letter-spacing:-.02em}
.greet em{font-style:normal;color:var(--saffron)}
.lede{color:var(--muted);font-size:17px;margin:0;max-width:46ch}
.lede b{color:var(--text);font-weight:600}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.chip b{color:var(--text);font-family:var(--mono);font-weight:600}
.chip svg{width:16px;height:16px}
.pill{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;border:1px solid;font-size:14px}
.pill.warn{background:rgba(255,179,71,.08);border-color:rgba(255,179,71,.4);color:#FFD9A3}
.pill.miss{background:rgba(255,122,107,.08);border-color:rgba(255,122,107,.4);color:#FFC2BA}
.pill.good{background:rgba(82,224,178,.08);border-color:rgba(82,224,178,.4);color:#B7F3DF}
.pill svg{width:18px;height:18px;flex:none}
.orbit-wrap{position:relative;width:100%;max-width:460px;justify-self:center;aspect-ratio:1}
.orbit-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.tk{stroke-width:3;stroke-linecap:round;animation:tkIn .6s ease both;animation-delay:calc(var(--i) * 7ms)}
.tk.future{stroke:rgba(214,222,255,.14)}
.tk.done{stroke:var(--mint)}
.tk.part{stroke:var(--sky)}
.tk.miss{stroke:var(--coral)}
.tk.today{stroke:var(--saffron);stroke-width:4.5}
@keyframes tkIn{from{opacity:.15}to{opacity:1}}
.pulse{fill:var(--saffron);transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
.orbit-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none;text-align:center}
.orbit-center .big{font-family:var(--display);font-weight:800;font-size:clamp(72px,14vw,128px);line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#FFFFFF 10%,#9FB2E8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.orbit-center .of{font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.1em}
.orbit-center .wk{margin-top:10px;font-size:13px;color:var(--saffron);font-weight:600;max-width:60%}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* ---------- sheet ---------- */
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,6,14,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,var(--bg2),var(--bg));border:1px solid var(--line-hi);border-bottom:0;border-radius:26px 26px 0 0;padding:14px 20px calc(28px + env(safe-area-inset-bottom,0px));animation:rise .32s cubic-bezier(.2,.9,.25,1) both}
@keyframes rise{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line-hi);margin:0 auto 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.sheet-head h2{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.01em;margin-top:6px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.dayprog{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--muted);font-size:14px}
.track{flex:1;height:6px;border-radius:9px;background:rgba(214,222,255,.1);overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:9px;transition:width .4s}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tcard{position:relative;text-align:left;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);min-height:150px;transition:transform .18s ease,border-color .2s,background .2s;animation:pop .4s cubic-bezier(.2,.9,.25,1.2) both;animation-delay:calc(var(--i) * 60ms)}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:.3}to{transform:none;opacity:1}}
.tcard:hover{transform:translateY(-3px);border-color:var(--c);background:var(--card-hi)}
.tcard .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.tcard .ico svg{width:20px;height:20px}
.tcard .cat{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:600}
.tcard .ttl{font-weight:600;font-size:16px;line-height:1.35}
.tcard .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.tcard.done{background:linear-gradient(180deg,rgba(82,224,178,.07),var(--card))}
.tcard .state{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.tcard.done .state{color:var(--mint)}
.tcard .state svg{width:14px;height:14px}
.subhead{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--coral);margin:22px 0 10px}
.subhead.plain{color:var(--muted)}
.celebrate{margin-top:18px;padding:18px;border-radius:var(--r);border:1px solid rgba(82,224,178,.4);background:rgba(82,224,178,.07);display:flex;gap:14px;align-items:center}
.celebrate h3{font-family:var(--display);font-size:18px}
.celebrate p{margin:2px 0 0;color:var(--muted);font-size:14px}
.celebrate svg{width:36px;height:36px;color:var(--mint);flex:none}

/* ---------- topic ---------- */
.topic{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;animation:slide .3s cubic-bezier(.2,.9,.25,1) both}
@keyframes slide{from{transform:translateX(30px);opacity:.3}to{transform:none;opacity:1}}
.topic-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;background:rgba(9,13,28,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topic-bar .where{display:flex;flex-direction:column;min-width:0}
.topic-bar .where span:last-child{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-body{max-width:820px;margin:0 auto;padding:26px 20px 140px;display:flex;flex-direction:column;gap:22px}
.topic-title{font-family:var(--display);font-weight:700;font-size:clamp(26px,4.6vw,40px);line-height:1.12;letter-spacing:-.02em}
.metarow{display:flex;gap:10px;flex-wrap:wrap}
.taskbox{border-radius:var(--r);padding:18px;background:color-mix(in srgb,var(--c) 9%,var(--card));border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.taskbox h3{font-size:13px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin-bottom:6px}
.taskbox p{margin:0}
.toc{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.toc button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--muted);min-height:38px}
.toc button:hover{color:var(--text);border-color:var(--line-hi)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .hint{font-size:13px;color:var(--dim);margin-left:auto}
.notes{display:flex;flex-direction:column;gap:14px}
.ncard{border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:20px 22px;scroll-margin-top:90px}
.ncard .nhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ncard .nno{font-family:var(--display);font-size:13px;font-weight:700;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,179,71,.13);color:var(--saffron);flex:none}
.ncard h2{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em}
.md{font-size:16px;line-height:1.7;color:#DCE1F2;overflow-wrap:anywhere}
.md h3{font-size:17px;margin:18px 0 6px;color:var(--text)}
.md h4{font-size:15px;margin:14px 0 4px;color:var(--text)}
.md p{margin:8px 0}
.md ul,.md ol{margin:8px 0;padding-left:22px}
.md li{margin:4px 0}
.md strong{color:var(--text)}
.md code{font-family:var(--mono);font-size:.88em;background:rgba(114,188,255,.1);color:#BFE0FF;padding:2px 6px;border-radius:6px}
.md pre{background:#060914;border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto;margin:12px 0}
.md pre code{background:none;color:#D6E4FF;padding:0;font-size:14px;line-height:1.6}
.md table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto;margin:10px 0}
.md th,.md td{border:1px solid var(--line-hi);padding:8px 10px;text-align:left}
.md th{background:rgba(214,222,255,.05)}
.md blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--saffron);background:rgba(255,179,71,.06);border-radius:0 10px 10px 0}
.skeleton{border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:12px}
.skeleton .ln{height:12px;border-radius:6px;background:linear-gradient(90deg,rgba(214,222,255,.06),rgba(214,222,255,.14),rgba(214,222,255,.06));background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.statusline{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(214,222,255,.2);border-top-color:var(--saffron);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.doubt{border-radius:var(--r);background:var(--card);border:1px dashed var(--line-hi);padding:18px;display:flex;flex-direction:column;gap:10px}
.doubt h3{font-size:16px}
.doubt-row{display:flex;gap:8px}
.doubt input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--line-hi);background:var(--bg);color:var(--text);padding:0 14px;font:inherit}
.dockbar{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,rgba(9,13,28,.96) 30%);display:flex;justify-content:center}
.dockbar .inner{width:100%;max-width:820px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dockbar .inner .btn.primary{flex:1;max-width:380px}
.stars-view{color:var(--saffron);letter-spacing:2px;font-size:15px}

/* ---------- rating ---------- */
.dialog{width:100%;max-width:480px;margin:auto;background:var(--bg2);border:1px solid var(--line-hi);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:18px;animation:rise .28s cubic-bezier(.2,.9,.25,1) both}
.overlay.center{align-items:center;padding:16px}
.dialog h2{font-family:var(--display);font-size:22px}
.dialog p{margin:0;color:var(--muted);font-size:14px}
.stars{display:flex;gap:6px}
.stars button{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--dim);transition:transform .12s, color .15s}
.stars button svg{width:26px;height:26px}
.stars button.on{color:var(--saffron);border-color:rgba(255,179,71,.5)}
.stars button:active{transform:scale(.92)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{color:var(--text);border-color:var(--sky);background:rgba(114,188,255,.12)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.field textarea,.field input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line-hi);border-radius:12px;padding:10px 12px;min-height:46px}
.field textarea{min-height:80px;resize:vertical}
.qlabel{font-size:14px;font-weight:600}

/* ---------- other screens ---------- */
.pagehead{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.pagehead h1{font-family:var(--display);font-size:clamp(28px,4.4vw,40px);font-weight:700;letter-spacing:-.02em}
.pagehead p{margin:0;color:var(--muted);max-width:60ch}
.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:18px}
.phase{padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.phase b{display:block;color:var(--text);font-size:14px}
.phase.on{border-color:var(--saffron)}
.phase.on b{color:var(--saffron)}
.weeks{display:flex;flex-direction:column;gap:10px}
.wk{border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden}
.wk.current{border-color:rgba(255,179,71,.55)}
.wk>button{width:100%;text-align:left;background:none;border:0;padding:16px 18px;display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;min-height:64px}
.wk .no{font-family:var(--display);font-weight:700;font-size:15px;color:var(--dim)}
.wk.current .no{color:var(--saffron)}
.wk .nm{font-weight:600}
.wk .mini-track{height:4px;border-radius:4px;background:rgba(214,222,255,.08);margin-top:8px;overflow:hidden}
.wk .mini-track i{display:block;height:100%;background:var(--mint)}
.wk .ct{font-family:var(--mono);font-size:13px;color:var(--muted)}
.wk-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:0 18px 18px}
.dbtn{border-radius:12px;border:1px solid var(--line);background:var(--bg2);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:72px;font-size:12px;color:var(--muted)}
.dbtn b{font-family:var(--display);font-size:16px;color:var(--text)}
.dbtn .dot{width:8px;height:8px;border-radius:50%;background:rgba(214,222,255,.15);margin-top:4px}
.dbtn.done .dot{background:var(--mint)} .dbtn.part .dot{background:var(--sky)} .dbtn.miss .dot{background:var(--coral)}
.dbtn.today{border-color:var(--saffron)}
.dbtn:hover{border-color:var(--line-hi)}
.grid-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat{border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:18px}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.panel{border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.panel h2{font-size:18px;font-family:var(--display);font-weight:700}
.panel p{margin:0;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px;border-bottom:1px solid var(--line-hi)}
.bars .b{flex:1;max-width:34px;border-radius:6px 6px 0 0;background:var(--sky);position:relative;min-height:4px}
.bars .b.hard{background:var(--coral)} .bars .b.easy{background:var(--mint)}
.barlbl{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.barlbl i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hardlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hardlist button{width:100%;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--bg2);padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:48px}
.hardlist small{color:var(--muted)}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.seg.levels{grid-template-columns:repeat(3,1fr)}
.status{font-size:13px;color:var(--dim)}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:4px;padding:6px;border-radius:20px;background:rgba(21,28,56,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line-hi);box-shadow:0 20px 40px -20px rgba(0,0,0,.7)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;min-height:52px;padding:6px 10px;border-radius:14px;font-size:11.5px;font-weight:600;color:var(--dim)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--saffron-ink);background:var(--saffron)}

const $=s=>document.querySelector(s);

function parse(s){const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(dt,n){const x=new Date(dt);x.setDate(x.getDate()+n);return x;}

function isDone(id){return !!S.done[id];}
function tasksFor(d){
  if(d<0||d>=DAYS) return [];
  const list=BASE[d].slice();
  if(d>0) BASE[d-1].forEach(t=>{const r=S.ratings[t.id]; if(r&&(r.d==='hard'||r.s<=2)) list.push({id:'r-'+t.id,k:'rev',cat:'Revision',text:'Revise: '+t.text,mins:30,day:d,src:t.id});});
  return list;
}
function findTask(id){
  if(BYID[id]) return BYID[id];
  if(id.indexOf('r-')===0){const src=BYID[id.slice(2)]; if(src) return tasksFor(src.day+1).find(t=>t.id===id)||{id:id,k:'rev',cat:'Revision',text:'Revise: '+src.text,mins:30,day:src.day+1,src:src.id};}
  return null;
}
function dayLeft(d){return tasksFor(d).filter(t=>!isDone(t.id)).length;}
function dayStatus(d,ti){const all=tasksFor(d), dn=all.filter(t=>isDone(t.id)).length; if(dn===all.length) return 'done'; if(d<ti) return dn>0?'part':'miss'; if(d===ti) return 'today'; return 'future';}
function missedList(ti){const out=[]; for(let i=0;i<Math.min(ti,DAYS);i++) tasksFor(i).forEach(t=>{if(!isDone(t.id)) out.push(t);}); return out;}
function streak(ti){let s=0,d=Math.min(ti,DAYS-1); if(d>=0&&dayLeft(d)>0) d--; while(d>=0&&dayLeft(d)===0){s++;d--;} return s;}
function pctDone(){let n=0; BASE.forEach(a=>a.forEach(t=>{if(isDone(t.id)) n++;})); return Math.round(n/TOTAL*100);}
function ratingList(){return Object.keys(S.ratings).map(id=>Object.assign({id:id},S.ratings[id])).filter(r=>r&&r.s).sort((a,b)=>String(a.at).localeCompare(String(b.at)));}
function avgRating(){const r=ratingList(); if(!r.length) return null; return r.reduce((n,x)=>n+x.s,0)/r.length;}
function starsText(n){return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n);}

function lock(){document.documentElement.classList.toggle('lock', !!($('#layer-sheet').innerHTML||$('#layer-topic').innerHTML||$('#layer-dialog').innerHTML));}
function greeting(){const h=new Date().getHours(); return h<12?'Good morning':h<17?'Good afternoon':'Good evening';}
function pastReminder(){const n=new Date(), hm=(S.remindAt||'20:00').split(':').map(Number); return n.getHours()*60+n.getMinutes()>=hm[0]*60+hm[1];}

/* ================= adaptive learning ================= */
function adaptation(){
  const r=ratingList().slice(-10);
  if(!r.length) return {summary:'No ratings yet. Rate each topic after you learn it, and new notes will adjust to you.',instr:'',hardTopics:[]};
  const avg=r.reduce((n,x)=>n+x.s,0)/r.length, hard=r.filter(x=>x.d==='hard').length, easy=r.filter(x=>x.d==='easy').length;
  let instr, summary;
  if(hard>=3||avg<3){instr='The learner is struggling: explain much more simply, use smaller steps, everyday analogies and more fully worked examples. Define every new term.'; summary='You found '+hard+' of your last '+r.length+' topics hard, so new notes use simpler steps and more worked examples.';}
  else if(easy>=4&&avg>=4){instr='The learner finds the material easy: add more depth, tricky edge cases, shortcuts and harder practice questions.'; summary='You found '+easy+' of your last '+r.length+' topics easy, so new notes go deeper with harder practice.';}
  else {instr='The learner is coping well: keep a clear, steady pace with a balance of explanation and practice.'; summary='Your recent ratings average '+avg.toFixed(1)+' of 5, so notes keep a steady pace.';}
  const comments=r.filter(x=>x.c).slice(-3).map(x=>{const t=findTask(x.id); return '"'+x.c+'" (about: '+(t?t.text:'a topic')+')';});
  const hardTopics=ratingList().filter(x=>x.d==='hard'||x.s<=2).map(x=>findTask(x.id)).filter(Boolean).slice(-5).map(t=>t.text);
  let full='Recent average understanding: '+avg.toFixed(1)+' of 5 across '+r.length+' topics. '+instr;
  if(hardTopics.length) full+=' Topics they found hard recently: '+hardTopics.join('; ')+'. Connect to these where useful.';
  if(comments.length) full+=' Their recent comments: '+comments.join(' ')+'.';
  return {summary:summary,instr:full,hardTopics:hardTopics};
}

function orbitSVG(ti){
  const cx=200,cy=200,r1=184,parts=[];
  for(let i=0;i<DAYS;i++){
    const a=(-90+i*360/DAYS)*Math.PI/180, long=i%7===0, r0=r1-(long?20:12);
    let cls=i>ti?'future':dayStatus(i,ti);
    parts.push('<line class="tk '+cls+'" style="--i:'+i+'" x1="'+(cx+Math.cos(a)*r0).toFixed(1)+'" y1="'+(cy+Math.sin(a)*r0).toFixed(1)+'" x2="'+(cx+Math.cos(a)*r1).toFixed(1)+'" y2="'+(cy+Math.sin(a)*r1).toFixed(1)+'"/>');
  }
  if(ti>=0&&ti<DAYS){const a=(-90+ti*360/DAYS)*Math.PI/180; const x=cx+Math.cos(a)*(r1+12), y=cy+Math.sin(a)*(r1+12); parts.push('<circle class="pulse" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5"/><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" fill="#FFB347"/>');}
  parts.push('<circle cx="200" cy="200" r="150" fill="none" stroke="rgba(214,222,255,.06)" stroke-width="1"/>');
  return '<svg viewBox="0 0 400 400" role="img" aria-label="Course progress: 112 days, one mark per day">'+parts.join('')+'</svg>';
}

function taskBrief(t){
  const main=BASE[t.day]?BASE[t.day].find(x=>x.k==='main'):null;
  switch(t.k){
    case 'apt': return 'Learn the formulas and shortcuts in these notes, go through the solved examples, then solve 25 questions. Give yourself about one minute per question.';
    case 'main': return 'Read the notes section by section. Type and run every example yourself, then write a one-page summary in your own words.';
    case 'side': return 'Study the notes, then answer the interview questions aloud as if you were in an interview.';
    case 'code': return t.cat==='GitHub' ? 'Push every program from this week to GitHub with a clear README.' : 'Practise today’s topic'+(main?' ('+main.text+')':'')+'. Try each program yourself before you look at the solution.';
    case 'jobs': return 'Apply to 5 roles today. Track company, role, date and status in a simple sheet.';
    case 'sun': return t.cat==='Mock test' ? 'Take a full 60-minute aptitude mock test with a timer, then review every wrong answer.' : 'Revise this week’s notes and redo the questions you got wrong.';
    case 'rev': return 'You rated this topic as hard. These notes explain it again in a simpler way. Re-read them and redo the practice.';
  }
  return '';
}

function mdToHTML(md){
  let html;
  try{ html=window.marked?window.marked.parse(md):null; }catch(e){html=null;}
  if(html==null) html='<p>'+esc(md).replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>')+'</p>';
  try{ if(window.DOMPurify) html=window.DOMPurify.sanitize(html); else html=html.replace(/<(script|iframe|object|embed|style)[\s\S]*?<\/\1>/gi,'').replace(/ on\w+="[^"]*"/gi,''); }catch(e){}
  return html;
}
function renderNotes(md){
  const box=$('#notes'); if(!box) return;
  const tmp=document.createElement('div'); tmp.innerHTML=mdToHTML(md);
  const sections=[]; let cur=null;
  Array.from(tmp.childNodes).forEach(n=>{
    if(n.nodeName==='H1'||n.nodeName==='H2'){cur={title:n.textContent.trim(),nodes:[]}; sections.push(cur);}
    else {if(!cur){cur={title:'Overview',nodes:[]}; sections.push(cur);} cur.nodes.push(n);}
  });
  box.innerHTML='';
  const toc=$('#toc'); if(toc) toc.innerHTML='';
  sections.forEach((s,i)=>{
    if(!s.nodes.some(n=>n.textContent.trim()||n.nodeType===1)) return;
    const c=document.createElement('section'); c.className='ncard'; c.id='sec-'+i;
    const head=document.createElement('div'); head.className='nhead';
    const no=document.createElement('span'); no.className='nno'; no.textContent=String(i+1).padStart(2,'0');
    const h2=document.createElement('h2'); h2.textContent=s.title;
    head.append(no,h2);
    const body=document.createElement('div'); body.className='md'; s.nodes.forEach(n=>body.appendChild(n));
    c.append(head,body); box.appendChild(c);
    if(toc){const b=document.createElement('button'); b.type='button'; b.textContent=s.title; b.dataset.jump='sec-'+i; toc.appendChild(b);}
  });
}

async function loadNotes(t,forceVariant){
  const id=t.id;
  if(!forceVariant){
    let doc=notesMem[id]||null;
    if(!doc&&db){ try{const snap=await db.doc('notes/'+id).get(); if(snap.exists){doc=snap.data(); notesMem[id]=doc;}}catch(e){} }
    if(!doc) doc=localNote(id);
    if(!doc){ try{const res=await fetch('notes/'+id+'.md',{cache:'no-cache'}); if(res.ok){const md=await res.text(); if(md.trim()){doc={md:md,variant:'file'}; notesMem[id]=doc;}}}catch(e){} }
    if(topicTask!==t) return;
    await ensureSample();
    if(doc&&doc.md){lastNotes=doc.md; renderNotes(doc.md); renderTools('idle'); showDoubt(); return;}
  }
  await ensureSample();
  if(topicTask!==t) return;
  if(!sample){ noteMsg('<h2>Notes for this topic are not written yet</h2><p>New notes are written by Claude, which only works when you open the Claude version of this site. <a href="'+APP_URL+'" target="_blank" rel="noopener">Open Placement Sprint on Claude</a> to write them, or add a file named notes/'+esc(id)+'.md to this site. You can also read the topic in your <a href="'+DOC_URL+'" target="_blank" rel="noopener">syllabus document</a>.</p>'); renderTools('idle'); return; }
  generate(t,forceVariant||'fresh');
}
function buildPrompt(t,variant){
  const d=t.day, wk=Math.floor(d/7), others=tasksFor(d).filter(x=>x.id!==t.id).map(x=>x.cat+': '+x.text).join('; ');
  const ad=adaptation();
  const src=t.src?findTask(t.src):null;
  const kindGuide={
    apt:'This is a quantitative aptitude, logical reasoning or verbal ability topic for company placement tests (TCS NQT, Infosys, Wipro, Accenture, Capgemini). Give every formula, shortcut tricks, and at least 6 fully solved examples of increasing difficulty with step-by-step working. In the practice section give 10 new questions of placement-test level, with answers and short solutions at the very end under the heading "Answers".',
    main:'This is a core learning topic. Teach it from the ground up with clear explanations, diagrams described in words where helpful, and runnable Python code examples (in ```python blocks) wherever the topic involves code.',
    side:'This is a core subject topic that interviewers ask about. Explain each concept clearly, compare related terms in a small table, and give the exact kind of answers expected in interviews.',
    code:'This is a coding practice task. Base it on today\'s main topic. Give 5 programs from easy to harder, each with a problem statement, sample input and output, and a hint. Put the full Python solutions with short explanations at the very end under the heading "Solutions".',
    jobs:'This is a job application task. Explain where and how to find fresher roles, how to tailor the resume for each application, how to write a short message to a recruiter, and how to track applications, with a ready-to-copy template.',
    sun:'This is a Sunday review task. Summarise the key ideas of the whole week, list the most important formulas or code patterns, and give a mixed set of practice questions with answers at the end.',
    rev:'This is a revision of a topic the learner rated as hard. Re-teach it from scratch in the simplest possible way, using a different angle and new examples than a standard explanation, then give easy-to-medium practice with answers.'
  }[t.k]||'';
  let v='';
  if(variant==='simpler') v='The learner asked for a SIMPLER explanation: use very simple English, everyday analogies, tiny steps and extra worked examples.';
  if(variant==='deeper') v='The learner asked to GO DEEPER: include advanced details, edge cases, performance notes, and harder interview-level questions.';
  return 'You are an expert, warm tutor writing complete study notes for '+(S.name||'the learner')+', a final-year Electronics and Instrumentation Engineering (EIE) student in India preparing for campus placements and learning AI/ML.\n\n'+
   'Course context: day '+(d+1)+' of 112, week '+(wk+1)+' ("'+W[wk].t+'"), phase "'+PHASES[Math.floor(wk/4)]+'".\n'+
   'Today\'s task to write notes for: ['+t.cat+'] '+t.text+(src?' (original topic: '+src.text+')':'')+'\n'+
   'Other tasks today: '+(others||'none')+'\n'+
   'Learner level: '+S.level+'.\n'+
   (ad.instr?'Adapt to this learner feedback: '+ad.instr+'\n':'')+
   (v?v+'\n':'')+'\n'+
   kindGuide+'\n\n'+
   'Write the notes in Markdown. Use exactly these top-level sections, each as a "## " heading, in this order:\n'+
   '## Why this matters\n## Core concepts\n## Worked examples\n## Common mistakes\n## Interview and test questions\n## Practice for today\n## Quick recap\n'+
   'Then add any extra sections the task needs (such as "## Answers" or "## Solutions") at the end.\n'+
   'Inside sections use ### subheadings, short paragraphs, bullet lists, tables and code blocks. For interview questions give each question in bold followed by a short model answer.\n'+
   'Rules: simple, clear English with short sentences; Indian context in examples (rupees, trains, cricket, exam marks); no emoji; do not start with a # title; aim for 1000 to 1600 words; be accurate.';
}
function sampleErr(code){
  return ({not_granted:'You chose not to let this page use Claude, so it cannot write new notes. Reload the page to allow it.',rate_limited:'Too many requests right now. Wait a minute, then tap Rewrite notes.',session_expired:'Your session expired. Reload the page and try again.',sampling_disabled:'Writing notes with Claude is turned off for this page.',prompt_too_large:'This request was too large. Try again with fewer details.',refused:'Claude could not write these notes. Try Rewrite notes.',empty_completion:'Claude returned nothing. Tap Rewrite notes to try again.'})[code]||'The notes could not be written. Tap Rewrite notes to try again.';
}
async function generate(t,variant){
  if(genCtl) genCtl.abort();
  const ctl=new AbortController(); genCtl=ctl;
  skeleton('Claude is writing your notes. This usually takes 20 to 60 seconds.');
  renderTools('busy');
  let lastPaint=0;
  try{
    const res=await sample(buildPrompt(t,variant),{signal:ctl.signal,modelTier:'default',cache:false,onText:({text})=>{
      if(topicTask!==t) return;
      const now=Date.now(); if(now-lastPaint>450){lastPaint=now; renderNotes(text+'\n');}
    }});
    if(topicTask!==t) return;
    genCtl=null;
    const md=res.text||'';
    lastNotes=md; renderNotes(md); renderTools('idle'); showDoubt();
    const doc={md:md,variant:variant,level:S.level,at:new Date().toISOString(),truncated:!!res.truncated};
    notesMem[t.id]=doc; saveNoteLocal(t.id,doc);
    if(db){ try{await db.doc('notes/'+t.id).set(doc);}catch(e){} }
    toast(res.truncated?'Notes saved. They were cut short, so try Explain it simpler for a shorter version.':'Notes saved. They will open instantly next time.');
  }catch(e){
    if(topicTask!==t) return;
    genCtl=null;
    if(e&&e.text){lastNotes=e.text; renderNotes(e.text);}
    else if(!(e&&e.code==='cancelled')) noteMsg('<h2>Notes not ready</h2><p>'+esc(sampleErr(e&&e.code))+'</p>');
    else if(!lastNotes) noteMsg('<h2>Stopped</h2><p>Tap Rewrite notes whenever you are ready.</p>');
    renderTools('idle');
    if(e&&e.code==='not_granted'){sample=null; renderTools('idle');}
  }
}
function showDoubt(){const d=$('#doubt'); if(d) d.hidden=!sample;}
async function askDoubt(){
  const q=($('#doubt-q')||{}).value; if(!q||!q.trim()||!sample||!topicTask) return;
  const out=$('#doubt-a'), btn=$('#doubt-go'); if(askCtl) askCtl.abort();
  const ctl=new AbortController(); askCtl=ctl; btn.disabled=true; out.innerHTML='<div class="statusline"><span class="spinner"></span>Thinking…</div>';
  const prompt='You are a patient tutor. A '+S.level+' final-year EIE student in India is studying: "'+topicTask.text+'".\nHere are their notes (may be partial):\n"""\n'+lastNotes.slice(0,9000)+'\n"""\nAnswer their question clearly in simple English, in under 250 words, with a small example if it helps. Use Markdown. No emoji.\nQuestion: '+q.trim();
  try{const res=await sample(prompt,{signal:ctl.signal,modelTier:'default',onText:({text})=>{out.innerHTML=mdToHTML(text);}}); out.innerHTML=mdToHTML(res.text);}
  catch(e){ out.innerHTML=e&&e.text?mdToHTML(e.text):(e&&e.code==='cancelled'?'':'<p>'+esc(sampleErr(e&&e.code))+'</p>'); }
  if(askCtl===ctl) askCtl=null; btn.disabled=false;
}

/* ================= rating ================= */
let rateState=null;
function openRate(){
  const t=topicTask; if(!t) return;
  const r=S.ratings[t.id]||{};
  rateState={s:r.s||0,d:r.d||'',c:r.c||''};
  renderRate(); lock();
  setTimeout(()=>{const h=$('#rate-title'); if(h) h.focus();},50);
}
function renderRate(){
  const t=topicTask, st=rateState;
  $('#layer-dialog').innerHTML='<div class="overlay center" data-close-dialog><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rate-title">'+
   '<div><span class="eyebrow">Rate this topic</span><h2 id="rate-title" tabindex="-1" style="margin-top:6px">'+esc(t.text)+'</h2></div>'+
   '<div><div class="qlabel" id="q1">How well do you understand it now?</div><div class="stars" role="radiogroup" aria-labelledby="q1" style="margin-top:10px">'+
     [1,2,3,4,5].map(n=>'<button type="button" role="radio" aria-checked="'+(st.s===n)+'" aria-label="'+n+' star'+(n>1?'s':'')+'" class="'+(n<=st.s?'on':'')+'" data-star="'+n+'">'+I.star+'</button>').join('')+'</div></div>'+
   '<div><div class="qlabel" id="q2">How did the notes feel?</div><div class="seg" role="radiogroup" aria-labelledby="q2" style="margin-top:10px">'+
     [['easy','Too easy'],['right','Just right'],['hard','Too hard']].map(x=>'<button type="button" role="radio" aria-checked="'+(st.d===x[0])+'" class="'+(st.d===x[0]?'on':'')+'" data-diff="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div>'+
   '<div class="field"><label for="rate-c">What was confusing? (optional)</label><textarea id="rate-c" maxlength="300" placeholder="For example: I did not understand remainders with negative numbers">'+esc(st.c)+'</textarea></div>'+
   '<p>Your answers shape the next notes. Topics you find hard get a revision task tomorrow.</p>'+
   '<div class="cta-row"><button class="btn primary" type="button" data-save-rate'+(st.s&&st.d?'':' disabled')+'>Save and mark learned</button><button class="btn ghost" type="button" data-close-dialog-btn>Cancel</button></div>'+
  '</div></div>';
}
function saveRate(){
  const t=topicTask, st=rateState; if(!t||!st||!st.s||!st.d) return;
  const c=($('#rate-c')||{}).value||'';
  S.ratings[t.id]={s:st.s,d:st.d,c:c.trim().slice(0,300),at:new Date().toISOString()};
  S.done[t.id]=new Date().toISOString().slice(0,10);
  rateState=null; $('#layer-dialog').innerHTML='';
  const d=t.day, dayDone=dayLeft(d)===0;
  closeTopic(); changed();
  toast(st.d==='hard'||st.s<=2?'Saved. A revision task is added for tomorrow.':'Saved. Next notes will adapt to your rating.');
  if(dayDone) confetti();
}

/* ================= confetti ================= */
function confetti(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas'); c.className='confetti'; document.body.appendChild(c);
  const ctx=c.getContext('2d'); const W2=c.width=innerWidth, H2=c.height=innerHeight;
  const cols=['#FFB347','#52E0B2','#72BCFF','#BBA2FF','#FF7A6B'];
  const ps=Array.from({length:140},()=>({x:W2/2,y:H2*0.55,vx:(Math.random()-.5)*14,vy:-Math.random()*16-4,s:Math.random()*6+4,c:cols[Math.floor(Math.random()*5)],r:Math.random()*6}));
  let f=0; (function tick(){ctx.clearRect(0,0,W2,H2); ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}); if(++f<120) requestAnimationFrame(tick); else c.remove();})();
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-close-sheet],[data-close-dialog],a'); if(!el) return;
  if(el.matches('.tabbar button')) {show(el.dataset.tab); return;}
  if(el.dataset.tabGo){show(el.dataset.tabGo); return;}
  if(el.hasAttribute('data-open-day')){openSheet(Number(el.dataset.openDay)); return;}
  if(el.hasAttribute('data-open-task')){openTopic(el.dataset.openTask); return;}
  if(el.hasAttribute('data-week')){const w=Number(el.dataset.week); renderJourney.open=renderJourney.open===w?-1:w; renderJourney(); return;}
  if(el.hasAttribute('data-close')){closeSheet(); return;}
  if(el.hasAttribute('data-close-sheet')&&e.target===el){closeSheet(); return;}
  if(el.hasAttribute('data-topic-back')){closeTopic(); return;}
  if(el.hasAttribute('data-jump')){const s=document.getElementById(el.dataset.jump); if(s) s.scrollIntoView({behavior:'smooth',block:'start'}); return;}
  if(el.hasAttribute('data-regen')&&topicTask){generate(topicTask,el.dataset.regen); return;}
  if(el.hasAttribute('data-stop')){if(genCtl) genCtl.abort(); return;}
  if(el.id==='doubt-go'){askDoubt(); return;}
  if(el.hasAttribute('data-rate')){openRate(); return;}
  if(el.hasAttribute('data-undo')&&topicTask){delete S.done[topicTask.id]; const id=topicTask.id; changed(); openTopic(id); toast('Marked as not learned.'); return;}
  if(el.hasAttribute('data-star')&&rateState){rateState.c=($('#rate-c')||{}).value||''; rateState.s=Number(el.dataset.star); renderRate(); return;}
  if(el.hasAttribute('data-diff')&&rateState){rateState.c=($('#rate-c')||{}).value||''; rateState.d=el.dataset.diff; renderRate(); return;}
  if(el.hasAttribute('data-save-rate')){saveRate(); return;}
  if(el.hasAttribute('data-close-dialog-btn')||(el.hasAttribute('data-close-dialog')&&e.target===el)){rateState=null; $('#layer-dialog').innerHTML=''; lock(); return;}
  if(el.hasAttribute('data-level')){S.level=el.dataset.level; changed(); return;}
  if(el.id==='reset'){$('#reset-box').innerHTML='<span class="status" style="align-self:center">Erase every tick and rating?</span><button class="btn small" type="button" id="reset-yes" style="border-color:var(--coral);color:var(--coral)">Yes, reset</button><button class="btn small ghost" type="button" id="reset-no">Cancel</button>'; return;}
  if(el.id==='reset-yes'){S.done={}; S.ratings={}; changed(); toast('Progress reset.'); return;}
  if(el.id==='reset-no'){renderSettings(); return;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='doubt-q'){e.preventDefault(); askDoubt(); return;}
  if(e.key!=='Escape') return;
  if($('#layer-dialog').innerHTML){rateState=null; $('#layer-dialog').innerHTML=''; lock();}
  else if($('#layer-topic').innerHTML) closeTopic();
  else if($('#layer-sheet').innerHTML) closeSheet();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='set-name'){S.name=el.value.trim().slice(0,30)||'friend'; changed();}
  else if(el.id==='set-start'&&el.value){S.startDate=el.value; renderJourney.open=undefined; changed();}
  else if(el.id==='set-remind'&&el.value){S.remindAt=el.value; changed();}
});
setInterval(()=>{if(!document.hidden&&!$('#layer-topic').innerHTML&&!$('#layer-dialog').innerHTML) renderScreens();},60000);

/* ================= boot ================= */
show('home');
(function autoPop(){
  const ti=todayIdx();
  if(ti>=0&&ti<DAYS&&(dayLeft(ti)>0||missedList(ti).length)) setTimeout(()=>{ if(!$('#layer-sheet').innerHTML&&!$('#layer-topic').innerHTML) openSheet(ti); },1400);
})();
(async()=>{
  try{ db = window.claude&&window.claude.use ? await window.claude.use('db') : null; }catch(e){db=null;}
  if(!db) return;
  ref=db.doc('tracker/progress'); storageNote='Connected to your Claude account';
  ref.onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites) return;
    if(writing||saveTimer) return;
    if(!snap.exists) return;
    const r=snap.data()||{};
    ['name','startDate','remindAt','level'].forEach(k=>{if(typeof r[k]==='string'&&r[k]) S[k]=r[k];});
    if(r.done&&typeof r.done==='object') S.done=Object.assign({},r.done);
    if(r.ratings&&typeof r.ratings==='object') S.ratings=Object.assign({},r.ratings);
    storageNote='Synced with your Claude account';
    saveLocal(); renderScreens();
  },()=>{ref=null; storageNote='Saved on this device only';});
})();
ensureSample();
})();
</script>
